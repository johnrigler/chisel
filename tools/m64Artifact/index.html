<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chisel M64 Artifact Workbench</title><style>
:root{color-scheme:dark;--bg:#0b0b0e;--p:#15151a;--l:#353540;--i:#ececf1;--m:#9c9ca9;--g:#acd6ac;--b:#e5abab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px/1.4 system-ui,sans-serif}main{max-width:1350px;margin:auto;padding:12px}h1{font-size:18px;margin:0}.muted{color:var(--m)}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.p{border:1px solid var(--l);background:var(--p);padding:10px;margin-top:10px}textarea,input,button{font:13px ui-monospace,monospace;color:var(--i);background:#0f0f14;border:1px solid #3b3b47;border-radius:3px}textarea{width:100%;min-height:145px;padding:7px}input{width:100%;padding:6px}button{padding:7px 9px}.short{min-height:80px}.out{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;background:#0d0d11;padding:7px;min-height:70px;font:12px ui-monospace,monospace}.status{white-space:pre-wrap;font:12px ui-monospace,monospace}.good{color:var(--g)}.bad{color:var(--b)}canvas{max-width:100%;height:auto;background:#000;border:1px solid var(--l);margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main>
<h1>CHISEL M64 ARTIFACT WORKBENCH</h1><div class="muted">generic controlled-JS staging: canonicalize -> token bytes -> M64 -> hydrate -> isolated test</div>
<div class="bar"><button id="dark">Dark Star</button><button id="text">Text example</button><button id="stage">Stage</button><button id="run">Run hydrated</button><button id="export">Export artifact</button><button id="import">Import artifact</button></div>
<div class="grid"><section class="p"><b>Source</b><textarea id="src"></textarea><p>entry <input id="entry"></p><b>Identifier map</b><textarea id="map" class="short"></textarea></section><section class="p"><b>Input JSON</b><textarea id="input" class="short"></textarea><b>Token profile</b><textarea id="tokens" class="short"></textarea><p>alphabet <input id="alphabet"></p></section></div>
<div class="grid"><section class="p"><b>Canonical JS</b><div id="canonical" class="out"></div></section><section class="p"><b>M64</b><textarea id="m64"></textarea></section></div>
<div class="grid"><section class="p"><b>Hydrated JS</b><div id="hydrated" class="out"></div></section><section class="p"><b>Status / result</b><div id="status" class="status">idle</div><canvas id="canvas" width="1" height="1"></canvas></section></div>
<section class="p"><b>Artifact JSON</b><textarea id="artifact"></textarea></section>
<script src="m64.js"></script><script>
"use strict";const S=id=>document.getElementById(id),M=ChiselM64;
const P={"alphabet":"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_","tokens":[".getContext(\"2d\")",".beginPath()",".closePath()",".lineTo(",".moveTo(",".fill()","function","const","return","canvas","width","height","ctx","(",")","{","}",";",",","=",".","*","+"]},DS="function darkStar(p){\n  function mod(n,m){return((n%m)+m)%m}\n  function putPixel(buf,w,h,x,y,r,g,b){\n    if(x<0||y<0||x>=w||y>=h)return;\n    const i=(y*w+x)*3;\n    buf[i]=r;buf[i+1]=g;buf[i+2]=b;\n  }\n  function drawLine(buf,w,h,x0,y0,x1,y1,r,g,b){\n    let dx=Math.abs(x1-x0),sx=x0<x1?1:-1;\n    let dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;\n    let err=dx+dy;\n    while(true){\n      putPixel(buf,w,h,x0,y0,r,g,b);\n      if(x0===x1&&y0===y1)break;\n      const e2=err*2;\n      if(e2>=dy){err+=dy;x0+=sx}\n      if(e2<=dx){err+=dx;y0+=sy}\n    }\n  }\n  const buf=new Uint8Array(p.width*p.height*3);\n  let yl=p.yLeft,yr=p.yRight,dyl=p.dyLeft,dyr=p.dyRight;\n  let rr=p.r,gg=p.g,bb=p.b,drr=p.dr,dgg=p.dg,dbb=p.db;\n  for(let i=0;i<p.lines;i++){\n    drawLine(buf,p.width,p.height,0,mod(yl,p.height),p.width-1,mod(yr,p.height),mod(rr,256),mod(gg,256),mod(bb,256));\n    yl+=dyl;yr+=dyr;\n    rr=mod(rr+drr,256);gg=mod(gg+dgg,256);bb=mod(bb+dbb,256);\n    if(p.slopeEvery>0&&(i+1)%p.slopeEvery===0){dyl+=p.ddyLeft;dyr+=p.ddyRight}\n    if(p.colorEvery>0&&(i+1)%p.colorEvery===0){drr+=p.ddr;dgg+=p.ddg;dbb+=p.ddb}\n  }\n  return buf;\n}\n",DI={"seed":124771,"width":1400,"height":900,"lines":1600,"yLeft":120,"yRight":160,"dyLeft":1,"dyRight":2,"slopeEvery":73,"ddyLeft":0,"ddyRight":-1,"r":24,"g":98,"b":180,"dr":1,"dg":2,"db":-1,"colorEvery":137,"ddr":1,"ddg":-1,"ddb":1},DH="f8ae0fb9eb89714ab56dcf583ee1481bce22f16f22e0493ca66a9a34047b5d62";
let st=null,lastHash="",lastBytes=0;
function show(t,ok){S("status").textContent=t;S("status").className="status "+(ok===true?"good":ok===false?"bad":"")}
function profile(){return{kind:"m64-profile",version:1,alphabet:S("alphabet").value,tokens:S("tokens").value.split(/\r?\n/).filter(Boolean)}}
function input(){return JSON.parse(S("input").value||"null")}
function stage(){st=M.stage(S("src").value,S("map").value,profile());S("canonical").textContent=st.canonical;S("m64").value=st.payload;S("hydrated").textContent=st.hydrated;const eq=st.canonical===st.hydrated;show(`STAGED\nsource bytes: ${M.utf8Len(S("src").value)}\ncanonical bytes: ${M.utf8Len(st.canonical)}\nabstract bytes: ${st.abstract.length}\nM64 characters: ${st.payload.length}\nhydrate equality: ${eq}`,eq);return st}
function entry(){return M.mappedEntry(S("entry").value,S("map").value)}
function sandbox(code,e,arg){return new Promise((res,rej)=>{const id=Math.random().toString(36).slice(2),f=document.createElement("iframe");f.sandbox="allow-scripts";f.style.display="none";const done=()=>{removeEventListener("message",msg);f.remove()},timer=setTimeout(()=>{done();rej(Error("8 second runtime limit"))},8000);function msg(x){if(x.source!==f.contentWindow||!x.data)return;if(x.data.k==="r")f.contentWindow.postMessage({k:"x",id,code,e,arg},"*");if(x.data.k==="y"&&x.data.id===id){clearTimeout(timer);done();x.data.ok?res(x.data.v):rej(Error(x.data.err))}}addEventListener("message",msg);f.srcdoc=`<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline' 'unsafe-eval';connect-src 'none'"><script>onmessage=async x=>{let d=x.data;if(!d||d.k!='x')return;try{let f=new Function('input',d.code+'\\n;return '+d.e+'(input)'),v=f(d.arg);if(v&&v.then)v=await v;parent.postMessage({k:'y',id:d.id,ok:1,v},'*')}catch(e){parent.postMessage({k:'y',id:d.id,ok:0,err:String(e.stack||e)},'*')}};parent.postMessage({k:'r'},'*')<\/script>`;document.body.appendChild(f)})}
async function hash(b){if(!crypto?.subtle)return"";const h=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function preview(b,p){const w=+p.width,h=+p.height,c=S("canvas");if(!(b instanceof Uint8Array)||b.length!==w*h*3){c.width=c.height=1;return false}c.width=w;c.height=h;const o=new Uint8ClampedArray(w*h*4);for(let s=0,d=0;s<b.length;s+=3,d+=4)o.set([b[s],b[s+1],b[s+2],255],d);c.getContext("2d").putImageData(new ImageData(o,w,h),0,0);return true}
async function run(){try{if(!st)stage();const p=input(),t=performance.now(),v=await sandbox(st.hydrated,entry(),p),ms=performance.now()-t;let b=v instanceof Uint8Array?v:v instanceof ArrayBuffer?new Uint8Array(v):null;lastBytes=b?.length||0;lastHash=b?await hash(b):"";let r=b?`Uint8Array(${b.length})`:JSON.stringify(v,null,2);if(b)preview(b,p);let out=`RUN OK\n${ms.toFixed(1)} ms\nresult: ${r}`;if(lastHash)out+=`\nSHA-256: ${lastHash}`;if(p.seed===124771&&lastHash)out+=`\nDark Star expected hash: ${lastHash===DH}`;show(out,true)}catch(e){show("RUN ERROR\n"+(e.stack||e),false)}}
function exp(){try{if(!st)stage();const a={kind:"chisel-m64-artifact",version:1,type:"javascript",runtime:"CHISEL-PURE1",entry:entry(),sourceEntry:S("entry").value,profile:profile(),input:input(),payload:S("m64").value.replace(/\s/g,"")};if(lastHash)a.test={resultBytes:lastBytes,sha256:lastHash};S("artifact").value=JSON.stringify(a,null,2);show("ARTIFACT EXPORTED",true)}catch(e){show(e.stack||String(e),false)}}
function imp(){try{const a=M.validateArtifact(JSON.parse(S("artifact").value));S("alphabet").value=a.profile.alphabet;S("tokens").value=a.profile.tokens.join("\n");S("input").value=JSON.stringify(a.input??{},null,2);S("entry").value=a.entry;S("map").value="";S("m64").value=a.payload;const code=M.hydrate(a.payload,a.profile);S("src").value=code;S("canonical").textContent=code;S("hydrated").textContent=code;st={canonical:code,hydrated:code,payload:a.payload,abstract:M.decode64(a.payload,a.profile.alphabet)};show("ARTIFACT IMPORTED\nentry: "+a.entry,true)}catch(e){show(e.stack||String(e),false)}}
function loadDark(){S("src").value=DS;S("entry").value="darkStar";S("map").value="darkStar=a\nmod=m\nputPixel=q\ndrawLine=l";S("alphabet").value=P.alphabet;S("tokens").value=P.tokens.join("\n");S("input").value=JSON.stringify(DI,null,2);st=null;stage()}
function loadText(){S("src").value='function main(p){const s=String(p.text||"");return{upper:s.toUpperCase(),length:s.length}}';S("entry").value="main";S("map").value="main=a";S("input").value='{"text":"domo arigato"}';st=null;stage()}
S("dark").onclick=loadDark;S("text").onclick=loadText;S("stage").onclick=()=>{try{stage()}catch(e){show(e.stack||String(e),false)}};S("run").onclick=run;S("export").onclick=exp;S("import").onclick=imp;loadDark();
</script></main></body></html>
