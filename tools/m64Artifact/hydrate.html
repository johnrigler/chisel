<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chisel M64 Hydrator</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:#15151a;--line:#353540;--ink:#ececf1;--muted:#9c9ca9;--good:#acd6ac;--bad:#e5abab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:18px;margin:0 0 5px}.muted{color:var(--muted)}.panel{border:1px solid var(--line);background:var(--panel);padding:11px;margin-top:11px}textarea,button{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:#0f0f14;border:1px solid #3b3b47;border-radius:3px}textarea{width:100%;min-height:220px;padding:8px;resize:vertical}button{padding:8px 10px;margin:5px 5px 5px 0;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out,.status{white-space:pre-wrap;word-break:break-word;background:#0d0d11;border:1px solid #2f2f39;padding:8px;min-height:100px;max-height:340px;overflow:auto;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.status{background:transparent;border:0;min-height:50px}.good{color:var(--good)}.bad{color:var(--bad)}canvas{display:block;max-width:100%;height:auto;background:#000;border:1px solid var(--line);margin-top:8px}@media(max-width:760px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>CHISEL M64 HYDRATOR</h1>
<div class="muted">Consumer for M64 v2 artifacts with expanding dictionary indexes.</div>
<section class="panel"><h3>Artifact JSON</h3><textarea id="artifact" spellcheck="false"></textarea><button id="hydrateBtn">Hydrate</button><button id="runBtn">Hydrate + run PURE1</button></section>
<div class="row"><section class="panel"><h3>Hydrated JavaScript</h3><div id="code" class="out"></div></section><section class="panel"><h3>Status / result</h3><div id="status" class="status">not run</div><canvas id="canvas" width="1" height="1"></canvas></section></div>
</main>
<script src="m64.js"></script>
<script>
"use strict";
const S=id=>document.getElementById(id),M=ChiselM64;
function show(text,ok){S("status").textContent=text;S("status").className="status "+(ok===true?"good":ok===false?"bad":"")}
function parseArtifact(){return M.validateArtifact(JSON.parse(S("artifact").value))}
function hydrate(){const a=parseArtifact(),code=M.hydrate(a.payload,a.profile);S("code").textContent=code;show("HYDRATED\nentry: "+a.entry+"\nruntime: "+a.runtime+"\ndictionary terms: "+a.profile.tokens.length+"\nM64 characters: "+a.payload.replace(/\s/g,"").length+"\nJavaScript bytes: "+M.utf8Len(code),true);return{artifact:a,code}}
function execute(code,entry,input){return new Promise((resolve,reject)=>{const id=Math.random().toString(36).slice(2),f=document.createElement("iframe");f.sandbox="allow-scripts";f.style.display="none";const cleanup=()=>{removeEventListener("message",onmsg);f.remove()},timer=setTimeout(()=>{cleanup();reject(Error("Artifact exceeded 8 second runtime limit"))},8000);function onmsg(ev){if(ev.source!==f.contentWindow||!ev.data)return;if(ev.data.kind==="ready")f.contentWindow.postMessage({kind:"run",id,code,entry,input},"*");else if(ev.data.kind==="result"&&ev.data.id===id){clearTimeout(timer);cleanup();ev.data.ok?resolve(ev.data.result):reject(Error(ev.data.error))}}addEventListener("message",onmsg);f.srcdoc=`<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline' 'unsafe-eval';connect-src 'none'"><script>addEventListener('message',async e=>{const d=e.data;if(!d||d.kind!=='run')return;try{const fn=new Function('input',d.code+'\\n;return '+d.entry+'(input)');let r=fn(d.input);if(r&&typeof r.then==='function')r=await r;parent.postMessage({kind:'result',id:d.id,ok:true,result:r},'*')}catch(x){parent.postMessage({kind:'result',id:d.id,ok:false,error:String(x&&x.stack||x)},'*')}});parent.postMessage({kind:'ready'},'*')<\/script>`;document.body.appendChild(f)})}
async function sha(bytes){if(!crypto?.subtle)return"";const h=await crypto.subtle.digest("SHA-256",bytes);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function renderRgb(bytes,input){const w=Number(input?.width),h=Number(input?.height),c=S("canvas");if(!(bytes instanceof Uint8Array)||!Number.isInteger(w)||!Number.isInteger(h)||bytes.length!==w*h*3){c.width=c.height=1;return false}c.width=w;c.height=h;const rgba=new Uint8ClampedArray(w*h*4);for(let s=0,d=0;s<bytes.length;s+=3,d+=4)rgba.set([bytes[s],bytes[s+1],bytes[s+2],255],d);c.getContext("2d",{alpha:false}).putImageData(new ImageData(rgba,w,h),0,0);return true}
async function run(){try{const {artifact:a,code}=hydrate(),t0=performance.now(),r=await execute(code,a.entry,a.input??{}),ms=performance.now()-t0;let text="RUN OK\nelapsed: "+ms.toFixed(1)+" ms";if(r instanceof Uint8Array){const h=await sha(r);text+="\nresult: Uint8Array("+r.length+")"+(h?"\nSHA-256: "+h:"");if(a.test?.sha256&&h)text+="\nexpected hash: "+(h===a.test.sha256);if(renderRgb(r,a.input))text+="\nRGB24 preview: "+a.input.width+" x "+a.input.height}else{text+="\nresult:\n"+(JSON.stringify(r,null,2)??String(r))}show(text,true)}catch(e){show("RUN ERROR\n"+(e.stack||e),false)}}
S("hydrateBtn").onclick=()=>{try{hydrate()}catch(e){show("HYDRATE ERROR\n"+(e.stack||e),false)}};S("runBtn").onclick=run;
</script>
</body>
</html>
