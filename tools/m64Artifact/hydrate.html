<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chisel M64 Hydrator</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:#15151a;--line:#353540;--ink:#ececf1;--muted:#9c9ca9;--good:#acd6ac;--bad:#e5abab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:18px;margin:0 0 5px}.muted{color:var(--muted)}.panel{border:1px solid var(--line);background:var(--panel);padding:11px;margin-top:11px}textarea,button{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:#0f0f14;border:1px solid #3b3b47;border-radius:3px}textarea{width:100%;min-height:220px;padding:8px;resize:vertical}button{padding:8px 10px;margin:5px 5px 5px 0;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out,.status{white-space:pre-wrap;word-break:break-word;background:#0d0d11;border:1px solid #2f2f39;padding:8px;min-height:100px;max-height:340px;overflow:auto;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.status{background:transparent;border:0;min-height:50px}.good{color:var(--good)}.bad{color:var(--bad)}canvas{display:block;max-width:100%;height:auto;background:#000;border:1px solid var(--line);margin-top:8px}@media(max-width:760px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>CHISEL M64 HYDRATOR</h1>
<div class="muted">Small consumer for self-contained chisel-m64-artifact packages. It does not create or publish transactions.</div>
<section class="panel">
<h3>Artifact JSON</h3>
<textarea id="artifact" spellcheck="false"></textarea>
<button id="hydrateBtn">Hydrate</button><button id="runBtn">Hydrate + run PURE1</button>
</section>
<div class="row">
<section class="panel"><h3>Hydrated JavaScript</h3><div id="code" class="out"></div></section>
<section class="panel"><h3>Status / result</h3><div id="status" class="status">not run</div><canvas id="canvas" width="1" height="1"></canvas></section>
</div>
</main>
<script>
"use strict";
const S=id=>document.getElementById(id);
function decode64(text,alphabet){const A=Array.from(alphabet);if(A.length!==64||new Set(A).size!==64)throw new Error("Artifact profile has an invalid M64 alphabet");const M=new Map(A.map((c,i)=>[c,i])),clean=Array.from(text).filter(c=>!/\s/.test(c));if(clean.length%4===1)throw new Error("Invalid M64 length");const vals=clean.map(c=>{if(!M.has(c))throw new Error("Character outside artifact M64 alphabet");return M.get(c)}),out=[];for(let i=0;i<vals.length;i+=4){const a=vals[i],b=vals[i+1],c=vals[i+2],d=vals[i+3];if(a===undefined||b===undefined)throw new Error("Invalid M64 tail");const n=(a<<18)|(b<<12)|((c??0)<<6)|(d??0);out.push((n>>16)&255);if(c!==undefined)out.push((n>>8)&255);if(d!==undefined)out.push(n&255)}return Uint8Array.from(out)}
function parseArtifact(){const a=JSON.parse(S("artifact").value);if(!a||a.kind!=="chisel-m64-artifact"||a.version!==1)throw new Error("Unsupported artifact package");if(a.type!=="javascript")throw new Error("This hydrator currently accepts JavaScript artifacts");if(a.runtime!=="CHISEL-PURE1")throw new Error("This hydrator currently runs CHISEL-PURE1 only");if(!a.profile||!Array.isArray(a.profile.tokens)||typeof a.profile.alphabet!=="string")throw new Error("Artifact has no embedded M64 profile");if(typeof a.payload!=="string")throw new Error("Artifact payload missing");if(!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(a.entry||""))throw new Error("Invalid entry identifier");return a}
function hydrate(){const a=parseArtifact(),bytes=decode64(a.payload,a.profile.alphabet),dict=a.profile.tokens;let out="";for(const b of bytes){if(b<128)out+=String.fromCharCode(b);else if(b<0xc0){const i=b-0x80;if(dict[i]===undefined)throw new Error("Undefined token index "+i);out+=dict[i]}else throw new Error("Reserved token byte 0x"+b.toString(16))}S("code").textContent=out;show("HYDRATED\nentry: "+a.entry+"\nruntime: "+a.runtime+"\nM64 characters: "+a.payload.replace(/\s/g,"").length+"\nJavaScript bytes: "+new TextEncoder().encode(out).length,true);return {artifact:a,code:out}}
function show(text,ok){S("status").textContent=text;S("status").className="status "+(ok===true?"good":ok===false?"bad":"")}
function execute(code,entry,input){return new Promise((resolve,reject)=>{const id=Math.random().toString(36).slice(2),f=document.createElement("iframe");f.sandbox="allow-scripts";f.style.display="none";const cleanup=()=>{window.removeEventListener("message",onmsg);f.remove()};const timer=setTimeout(()=>{cleanup();reject(new Error("Artifact exceeded 8 second runtime limit"))},8000);function onmsg(ev){if(ev.source!==f.contentWindow||!ev.data)return;if(ev.data.kind==="ready")f.contentWindow.postMessage({kind:"run",id,code,entry,input},"*");else if(ev.data.kind==="result"&&ev.data.id===id){clearTimeout(timer);cleanup();ev.data.ok?resolve(ev.data.result):reject(new Error(ev.data.error))}}window.addEventListener("message",onmsg);f.srcdoc=`<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';connect-src 'none';img-src 'none';media-src 'none';frame-src 'none';object-src 'none';base-uri 'none'"><script>addEventListener("message",async e=>{const d=e.data;if(!d||d.kind!=="run")return;try{const fn=new Function("input",d.code+"\\n;return "+d.entry+"(input);");let r=fn(d.input);if(r&&typeof r.then==="function")r=await r;parent.postMessage({kind:"result",id:d.id,ok:true,result:r},"*")}catch(x){parent.postMessage({kind:"result",id:d.id,ok:false,error:String(x&&x.stack||x)},"*")}});parent.postMessage({kind:"ready"},"*");<\/script>`;document.body.appendChild(f)})}
async function sha(bytes){if(!crypto||!crypto.subtle)return"";const h=await crypto.subtle.digest("SHA-256",bytes);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function renderRgb(bytes,input){const w=Number(input&&input.width),h=Number(input&&input.height),c=S("canvas");if(!(bytes instanceof Uint8Array)||!Number.isInteger(w)||!Number.isInteger(h)||bytes.length!==w*h*3){c.width=1;c.height=1;return false}c.width=w;c.height=h;const rgba=new Uint8ClampedArray(w*h*4);for(let s=0,d=0;s<bytes.length;s+=3,d+=4){rgba[d]=bytes[s];rgba[d+1]=bytes[s+1];rgba[d+2]=bytes[s+2];rgba[d+3]=255}c.getContext("2d",{alpha:false}).putImageData(new ImageData(rgba,w,h),0,0);return true}
async function run(){try{const {artifact:a,code}=hydrate(),t0=performance.now(),r=await execute(code,a.entry,a.input??{}),ms=performance.now()-t0;let text="RUN OK\nelapsed: "+ms.toFixed(1)+" ms";if(r instanceof Uint8Array){const h=await sha(r);text+="\nresult: Uint8Array("+r.length+")"+(h?"\nSHA-256: "+h:"");if(a.test&&a.test.sha256&&h)text+="\nexpected hash: "+(h===a.test.sha256);if(renderRgb(r,a.input))text+="\nRGB24 preview: "+a.input.width+" x "+a.input.height}else{let j;try{j=JSON.stringify(r,null,2)}catch{j=String(r)}text+="\nresult:\n"+(j||String(r))}show(text,true)}catch(e){show("RUN ERROR\n"+(e.stack||e),false)}}
S("hydrateBtn").onclick=()=>{try{hydrate()}catch(e){show("HYDRATE ERROR\n"+(e.stack||e),false)}};S("runBtn").onclick=run;
</script>
</body>
</html>
