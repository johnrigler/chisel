<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chisel Noble Litecoin Test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; color: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { padding: 10px 14px; border-bottom: 1px solid #29313a; background: #10151b; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    strong { color: #fff; }
    #status { color: #ffd166; }
    #status.ready { color: #a3e635; }
    #status.error { color: #ff7b7b; }
    code { color: #c5f467; }
    iframe { width: 100%; height: 100%; border: 0; background: #0b0d10; }
  </style>
</head>
<body>
  <header>
    <strong>Noble secp256k1 migration test</strong>
    <span id="status">Loading Chisel and Noble…</span>
    <span>Production check: local Noble only. Legacy comparisons run offline on public fixture keys.</span>
    <span>Console: <code>CHISEL.getSigningBackendInfo()</code></span>
  </header>
  <iframe id="chiselFrame" title="Chisel Noble test"></iframe>

  <script type="module">
    const status = document.querySelector('#status');
    const frame = document.querySelector('#chiselFrame');
    const rootUrl = new URL('../../index.html', import.meta.url);

    frame.addEventListener('load', async () => {
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;

        if (!win || !doc || !win.CHISEL) {
          throw new Error('The Chisel frame did not expose window.CHISEL.');
        }

        const info = win.CHISEL.getSigningBackendInfo();
        if (info.selected !== 'noble' || !info.nobleAvailable) {
          throw new Error('Noble backend did not become active.');
        }

        win.CHISEL_DEBUG = win.CHISEL_DEBUG || {};
        win.CHISEL_DEBUG.NOBLE_TEST = true;
        win.CHISEL_DEBUG.SIGNING = info;

        status.textContent = 'READY: local Noble active; no legacy signatures generated.';
        status.className = 'ready';
      } catch (error) {
        console.error(error);
        status.textContent = 'ERROR: ' + (error && error.message ? error.message : String(error));
        status.className = 'error';
      }
    }, { once: true });

    frame.src = rootUrl.href;
  </script>
</body>
</html>
