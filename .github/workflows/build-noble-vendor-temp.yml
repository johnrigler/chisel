name: Wire Noble browser default

on:
  push:
    branches:
      - feature/noble-default-20260912
    paths:
      - .github/workflows/build-noble-vendor-temp.yml

permissions:
  contents: write

jobs:
  wire-default:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/noble-default-20260912

      - name: Wire the ordinary Chisel page to vendored Noble
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text()

          old_scripts = '''  <script src="vendor/qrcode.min.js?rev=20260911b"></script>
            <script src="chisel.js?rev=20260906b"></script>
            <script src="chisel.unspendable.js?rev=20260906b"></script>
            <script src="chisel.image.js?rev=20260906b"></script>
            <script src="chisel.sign.js?rev=20260906b"></script>
            <script src="chisel.ravencoin.js?rev=20260906b"></script>'''
          # The source uses two-space indentation, not the visual indentation above.
          old_scripts = old_scripts.replace('            <script', '  <script')
          new_scripts = '''  <script src="vendor/qrcode.min.js?rev=20260911b"></script>
          <script src="chisel.js?rev=20260906b"></script>
          <script src="chisel.unspendable.js?rev=20260906b"></script>
          <script src="chisel.image.js?rev=20260906b"></script>
          <script src="vendor/noble-secp256k1-3.2.0.iife.js?rev=20260912a"></script>
          <script src="chisel.secp256k1.js?rev=20260912a"></script>
          <script src="chisel.secp256k1.noble.js?rev=20260912a"></script>
          <script src="chisel.sign.js?rev=20260912a"></script>
          <script src="chisel.secp256k1.bootstrap.js?rev=20260912a"></script>
          <script src="chisel.sign.backend.js?rev=20260912a"></script>
          <script src="chisel.ravencoin.js?rev=20260906b"></script>'''

          if old_scripts not in index:
              raise SystemExit('Expected index.html signing script block was not found')
          index = index.replace(old_scripts, new_scripts, 1)

          old_hero = 'This is the colleague-facing bridge between the older signing conversation, the 2020 crypto-linguistic white paper, and the current Chisel implementation. It now starts with the practical reason Chisel is vanilla JavaScript: elliptic gives the browser enough secp256k1 machinery to sign locally without turning the main app into a Node stack dependency tour.'
          new_hero = 'This is the colleague-facing bridge between the older signing conversation, the 2020 crypto-linguistic white paper, and the current Chisel implementation. Chisel remains vanilla JavaScript and now uses a pinned browser build of @noble/secp256k1 as its default local signer. The legacy elliptic path is temporarily retained only as a byte-for-byte parity oracle during the cutover.'
          if old_hero not in index:
              raise SystemExit('Expected Start-mode signing description was not found')
          index = index.replace(old_hero, new_hero, 1)

          old_boundary = 'Core builds, signs, serializes, decodes, and explains meaningful UTXO transactions. The main app remains plain browser JavaScript. elliptic is part of the core signing path. Portal displays and filters transaction artifacts. Data is a static or local snapshot. fileProxy, bunOven, keeperBun, scanners, label tools, and importers are satellites.'
          new_boundary = 'Core builds, signs, serializes, decodes, and explains meaningful UTXO transactions. The main app remains plain browser JavaScript. @noble/secp256k1 is the default signing primitive; elliptic remains temporarily available only for migration parity checks. Portal displays and filters transaction artifacts. Data is a static or local snapshot. fileProxy, bunOven, keeperBun, scanners, label tools, and importers are satellites.'
          if old_boundary not in index:
              raise SystemExit('Expected Current boundary description was not found')
          index = index.replace(old_boundary, new_boundary, 1)
          index_path.write_text(index)

          docs_path = Path('docs/SECP256K1_MIGRATION.md')
          docs = docs_path.read_text()
          old_status = 'Status: the Noble migration boundary and guarded test harness are merged into `main`. The Noble path has been exercised successfully through the guarded Litecoin/browser flow. The remaining production cutover is packaging and wiring a pinned standalone browser copy of Noble into the ordinary Chisel page so the legacy elliptic runtime can be removed without breaking static or `file://` use.'
          new_status = 'Status: Chisel now vendors a pinned classic-script browser build of `@noble/secp256k1` 3.2.0 and the ordinary Chisel page installs Noble as the default secp256k1 backend. The guarded Litecoin/browser flow and byte-for-byte transaction parity floor remain in place. The legacy elliptic runtime is temporarily retained only as a parity oracle; removing it is the next migration gate.'
          if old_status not in docs:
              raise SystemExit('Expected migration status paragraph was not found')
          docs = docs.replace(old_status, new_status, 1)

          old_cutover = '''## Production cutover

          The migration code is now in `main`, but the normal static browser page still needs a standalone pinned Noble artifact before elliptic can be removed safely.

          The remaining sequence is intentionally small:

          1. vendor or generate a pinned classic-script/IIFE browser build of `@noble/secp256k1` under `vendor/`;
          2. load the Noble boundary and adapter from the ordinary Chisel page;
          3. make Noble the default production backend;
          4. rerun the existing transaction, browser, and chain regression floors without the parity guard;
          5. remove the embedded/vendored elliptic runtime and its license record only after no ordinary path loads or calls it.

          Do not delete elliptic before step 3. The merged branch still uses it as the legacy default and as a byte-for-byte parity oracle in the guarded migration harness.
          '''
          old_cutover = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_cutover.splitlines()) + '\n'
          new_cutover = '''## Production cutover

          The ordinary static browser page now loads a pinned `@noble/secp256k1` 3.2.0 IIFE from `vendor/`, installs it through the implementation-neutral boundary, and selects Noble as the default signer. No npm, CDN, import map, Node runtime, or build step is required when Chisel runs.

          Elliptic is deliberately still embedded for this gate. When Noble signs, the migration wrapper signs the same transaction with the legacy path and requires the complete serialized transactions to match byte-for-byte before returning the Noble result.

          The remaining sequence is:

          1. exercise the ordinary Chisel page and supported chain fixtures with Noble selected by default;
          2. add a parity-free production regression floor using the Noble path alone;
          3. remove the legacy comparison from ordinary signing;
          4. remove the embedded/vendored elliptic runtime and its license record only after no ordinary path loads or calls it.

          Do not delete elliptic during this gate. It is no longer the default signer, but it is still the migration oracle.
          '''
          new_cutover = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_cutover.splitlines()) + '\n'
          if old_cutover not in docs:
              raise SystemExit('Expected Production cutover section was not found')
          docs = docs.replace(old_cutover, new_cutover, 1)
          docs_path.write_text(docs)
          PY

      - name: Verify Noble production wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/noble-secp256k1-3.2.0.iife.js
          node --check chisel.secp256k1.js
          node --check chisel.secp256k1.noble.js
          node --check chisel.secp256k1.bootstrap.js
          node --check chisel.sign.backend.js
          grep -q 'vendor/noble-secp256k1-3.2.0.iife.js' index.html
          grep -q 'chisel.secp256k1.bootstrap.js' index.html
          grep -q 'chisel.sign.backend.js' index.html
          grep -q "let selectedBackend = 'noble';" chisel.sign.backend.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          required = [
              'vendor/noble-secp256k1-3.2.0.iife.js',
              'chisel.secp256k1.js',
              'chisel.secp256k1.noble.js',
              'chisel.sign.js',
              'chisel.secp256k1.bootstrap.js',
              'chisel.sign.backend.js',
          ]
          positions = [s.index(x) for x in required]
          if positions != sorted(positions):
              raise SystemExit('Noble script load order is wrong: ' + repr(list(zip(required, positions))))
          print('Noble production script order verified')
          PY

      - name: Commit Noble default wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/SECP256K1_MIGRATION.md
          if git diff --cached --quiet; then
            echo 'Noble browser default already wired.'
            exit 0
          fi
          git commit -m 'Wire Noble as the default browser signer'
          git push origin HEAD:feature/noble-default-20260912
