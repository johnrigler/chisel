name: Chisel regression floor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  noble-vendor-build:
    if: github.ref == 'refs/heads/feature/noble-default-20260912' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/noble-default-20260912

      - name: Set up Node for pinned Noble build
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Build pinned classic-script Noble bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-noble-vendor
          mkdir tmp-noble-vendor
          cd tmp-noble-vendor
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @noble/secp256k1@3.2.0 esbuild@0.25.9
          cat > entry.mjs <<'EOF'
          import * as noble from '@noble/secp256k1';
          globalThis.nobleSecp256k1 = Object.freeze(noble);
          EOF
          mkdir -p ../vendor
          ./node_modules/.bin/esbuild entry.mjs \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --legal-comments=inline \
            --banner:js='/*! @noble/secp256k1 3.2.0 | MIT | generated by esbuild 0.25.9 for Chisel */' \
            --outfile=../vendor/noble-secp256k1-3.2.0.iife.js
          cd ..
          rm -rf tmp-noble-vendor

      - name: Smoke-test generated global
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const src = fs.readFileSync('vendor/noble-secp256k1-3.2.0.iife.js', 'utf8');
          vm.runInThisContext(src, { filename: 'noble-secp256k1-3.2.0.iife.js' });
          const noble = globalThis.nobleSecp256k1;
          if (!noble) throw new Error('Noble global missing');
          for (const name of ['getPublicKey', 'signAsync', 'verify']) {
            if (typeof noble[name] !== 'function') throw new Error('Noble global missing ' + name);
          }
          const key = new Uint8Array(32); key[31] = 1;
          const pub = noble.getPublicKey(key, true);
          if (pub.length !== 33) throw new Error('Unexpected public key length');
          console.log('Noble browser vendor smoke test passed');
          NODE

      - name: Commit generated vendor artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/noble-secp256k1-3.2.0.iife.js
          if git diff --cached --quiet; then
            echo 'Vendor artifact already current.'
            exit 0
          fi
          git commit -m 'Vendor Noble secp256k1 3.2.0 browser bundle'
          git push origin HEAD:feature/noble-default-20260912

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run protocol and crypto-boundary tests
        run: node --test tests/m64.test.mjs tests/m64.evm.test.mjs tests/secp256k1-boundary.test.mjs tests/qr-etch-handoff.test.mjs

      - name: Check browser JavaScript syntax
        run: |
          node --check chisel.secp256k1.js
          node --check chisel.secp256k1.noble.js
          node --check tools/m64Artifact/m64.js
          node --check tools/m64Artifact/m64.artifact.js
          node --check tools/m64Artifact/m64.javascript.js
          node --check tools/m64Artifact/m64.dictionary.js
          node --check tools/m64Artifact/m64.dictionary.evm.js
          node --check tools/m64Artifact/m64.v3.js
          node --check chisel.portal.static-data.js
          node --check chisel.thunderwords.js
          node --check chisel.portal.js
          node --check app.js
          node tests/check-inline-scripts.mjs index.html qrScan.html tools/m64Artifact/deploy-dictionary-polygon.html tools/m64Artifact/dictionary-polygon.html tools/m64Artifact/packet-polygon.html

      - name: Check fileProxy Python syntax
        run: python3 -m py_compile tools/fileProxy/proxy.py tools/fileProxy/proxys.py

  secp256k1-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/secp256k1Migration
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for Noble 3
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install Noble migration dependency
        run: npm install --no-audit --no-fund

      - name: Compare Noble with Chisel vendored elliptic
        run: npm test

  hardhat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/m64Artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for Hardhat 3
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install Hardhat workspace
        run: npm install --no-audit --no-fund

      - name: Compile with Hardhat
        run: npm run compile

      - name: Compile with standalone solc Standard JSON
        run: npm run compile:standalone

      - name: Run Hardhat contract tests
        run: npm test

      - name: Run presentation demo
        run: npm run demo

      - name: Upload compiler and dependency artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m64-dictionary-hardhat
          path: |
            tools/m64Artifact/artifacts/contracts/M64Dictionary.sol/M64Dictionary.json
            tools/m64Artifact/.standalone-artifacts/M64Dictionary.json
            tools/m64Artifact/package-lock.json

      - name: Verify exact deployment bytecode across compiler paths
        run: |
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('artifacts/contracts/M64Dictionary.sol/M64Dictionary.json'));const s=JSON.parse(fs.readFileSync('.standalone-artifacts/M64Dictionary.json'));const c=JSON.parse(fs.readFileSync('contracts/M64Dictionary.compiled.json'));if(h.bytecode!==s.bytecode)throw Error('Hardhat and standalone solc creation bytecode differ');if(h.bytecode!==c.bytecode)throw Error('captured browser deployment bytecode is stale');if(h.deployedBytecode!==s.deployedBytecode)throw Error('Hardhat and standalone solc runtime bytecode differ')"
