name: Chisel regression floor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run protocol and crypto-boundary tests
        run: node --test tests/*.test.mjs

      - name: Check browser JavaScript syntax
        run: |
          node tests/check-vendor.mjs
          node tools/build-driver.mjs --check
          node --check chisel.sign.js
          node --check chisel.identity.js
          node --check chisel.sign.backend.js
          node --check chisel.safety.js
          node --check chisel.ravencoin.js
          node --check chisel.digibyte.js
          node --check chisel.js
          node --check chisel.litecoin.js
          node --check chisel.secp256k1.js
          node --check chisel.secp256k1.noble.js
          node --check tools/m64Artifact/m64.js
          node --check tools/m64Artifact/m64.artifact.js
          node --check tools/m64Artifact/m64.javascript.js
          node --check tools/m64Artifact/m64.dictionary.js
          node --check tools/m64Artifact/m64.dictionary.evm.js
          node --check tools/m64Artifact/m64.v3.js
          node --check chisel.portal.static-data.js
          node --check chisel.portal.payload.js
          node --check chisel.portal.notes.js
          node --check chisel.portal.note-function.js
          node --check tools/noteRunner/runner.js
          node --check chisel.portal.record.js
          node --check chisel.activity-monitor.js
          node --check chisel.portal.store.js
          node --check chisel.portal.view.js
          node --check chisel.interactions.js
          node --check chisel.interactions.ui.js
          node --check chisel.portal.queue.js
          node --check chisel.thunderwords.js
          node --check chisel.portal.js
          node --check chisel.evm.contracts.js
          node --check chisel.evm.write.js
          node --check chisel.evm.write.ui.js
          node --check tools/evmFactory/factory.js
          node --check tools/evmFactory/app.js
          node --check chisel.evm.chisel.js
          node --check chisel.record-preview.js
          node --check chisel.portal.publication.js
          node --check tools/recast/core.js
          node --check tools/recast/timing.js
          node --check tools/recast/storage.js
          node --check tools/recast/recast.js
          node --check tools/recast/render-source.js
          node --check app.js
          node --check chisel.stickers.js
          node --check sticker.js
          node --input-type=module --check < ctp500.js
          node --input-type=module --check < ctp500-ble.js
          node --input-type=module --check < ctp500-print.js
          node --input-type=module --check < tools/keyPrint/key-print.js
          node tests/check-inline-scripts.mjs tools/recorder/index.html tools/qrField/index.html records.html
          node tests/check-inline-scripts.mjs index.html evm.html qrScan.html tools/m64Artifact/deploy-dictionary-polygon.html tools/m64Artifact/dictionary-polygon.html tools/m64Artifact/packet-polygon.html
          node tests/check-inline-scripts.mjs Solidity/index.html

      - name: Check fileProxy Python syntax
        run: python3 -m py_compile tools/fileProxy/proxy.py tools/fileProxy/proxys.py

  secp256k1-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/secp256k1Migration
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node for Noble 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'

      - name: Install Noble migration dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compare Noble with Chisel vendored elliptic
        run: npm test

  hardhat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/m64Artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node for Hardhat 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Install Hardhat workspace
        run: npm install --no-audit --no-fund

      - name: Compile with Hardhat
        run: npm run compile

      - name: Compile with standalone solc Standard JSON
        run: npm run compile:standalone

      - name: Compile reusable Chisel artifact with pinned standalone solc
        run: SOLC=./node_modules/.bin/solcjs python3 ../../Solidity/build-chisel.py

      - name: Upload compiled Chisel ABI and creation bytecode
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chisel-evm-deployment-artifact
          path: Solidity/compiled/Chisel.json

      - name: Run Hardhat contract tests
        run: npm test

      - name: Run presentation demo
        run: npm run demo

      - name: Upload compiler and dependency artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m64-dictionary-hardhat
          path: |
            tools/m64Artifact/artifacts/contracts/M64Dictionary.sol/M64Dictionary.json
            tools/m64Artifact/.standalone-artifacts/M64Dictionary.json
            tools/m64Artifact/package-lock.json

      - name: Verify exact deployment bytecode across compiler paths
        run: |
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('artifacts/contracts/M64Dictionary.sol/M64Dictionary.json'));const s=JSON.parse(fs.readFileSync('.standalone-artifacts/M64Dictionary.json'));const c=JSON.parse(fs.readFileSync('../../Solidity/compiled/M64Dictionary.json'));if(h.bytecode!==s.bytecode)throw Error('Hardhat and standalone solc creation bytecode differ');if(h.bytecode!==c.bytecode)throw Error('captured browser deployment bytecode is stale');if(h.deployedBytecode!==s.deployedBytecode)throw Error('Hardhat and standalone solc runtime bytecode differ')"

  publish-chisel:
    # The write token is available only after trusted main-branch CI succeeds.
    # PR code never runs in a job with repository write permissions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [regression, hardhat, secp256k1-migration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Retrieve compiled Chisel artifact from successful build
        uses: actions/download-artifact@v4
        with:
          name: chisel-evm-deployment-artifact
          path: Solidity/compiled

      - name: Verify artifact hashes before publishing
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = Path("Solidity/Chisel.sol").read_bytes()
          artifact = json.loads(Path("Solidity/compiled/Chisel.json").read_text())
          assert artifact["sourceSha256"] == hashlib.sha256(source).hexdigest()
          assert artifact["bytecodeSha256"] == hashlib.sha256(bytes.fromhex(artifact["bytecode"][2:])).hexdigest()
          assert artifact["contractName"] == "Chisel"
          assert isinstance(artifact["abi"], list) and artifact["abi"]
          print("Verified compiled Chisel artifact matches source and creation hash")
          PY

      - name: Commit compiled Chisel artifact to main if changed
        run: |
          git add Solidity/compiled/Chisel.json
          if git diff --cached --quiet; then
            echo "Chisel artifact already matches tracked version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish compiled Chisel ABI and bytecode [skip ci]"
          git push origin HEAD:main
